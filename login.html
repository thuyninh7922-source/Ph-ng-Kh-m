<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập & Đăng ký - Lộc Khang Clinic</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏥</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white max-w-md w-full rounded-2xl shadow-lg p-8 border border-slate-200">
        <div class="text-center mb-6">
            <a href="/" class="text-3xl font-bold text-teal-700">🏥 Lộc Khang Clinic</a>
            <p class="text-slate-500 text-sm mt-1">Cổng thông tin bệnh nhân & Quản trị y tế</p>
        </div>

        <div class="flex border-b border-slate-200 mb-6">
            <button id="tabLogin" onclick="switchMode('login')" class="w-1/2 py-2.5 font-bold text-teal-700 border-b-2 border-teal-700">Đăng nhập</button>
            <button id="tabRegister" onclick="switchMode('register')" class="w-1/2 py-2.5 font-bold text-slate-400">Đăng ký mới</button>
        </div>

        <!-- Form Đăng nhập -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-1">Số điện thoại (hoặc tài khoản admin)</label>
                <input type="text" id="loginPhone" required class="w-full border border-slate-300 rounded-xl p-3" placeholder="0912345678">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">Mật khẩu</label>
                <input type="password" id="loginPass" required class="w-full border border-slate-300 rounded-xl p-3" placeholder="••••••">
            </div>
            <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-xl transition">Đăng nhập hệ thống</button>
            <p class="text-xs text-slate-400 text-center mt-2">Tài khoản quản trị mẫu: <b>admin</b> / <b>123456</b></p>
        </form>

        <!-- Form Đăng ký -->
        <form id="registerForm" class="hidden space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-1">Họ và tên bệnh nhân *</label>
                <input type="text" id="regName" required class="w-full border border-slate-300 rounded-xl p-3" placeholder="Nguyễn Văn A">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">Số điện thoại *</label>
                <input type="tel" id="regPhone" required class="w-full border border-slate-300 rounded-xl p-3" placeholder="0912345678">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">Tạo mật khẩu *</label>
                <input type="password" id="regPass" required class="w-full border border-slate-300 rounded-xl p-3" placeholder="Tối thiểu 6 ký tự">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition">Tạo tài khoản bệnh nhân</button>
        </form>
    </div>

    <script>
        function switchMode(mode) {
            if (mode === 'login') {
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('registerForm').classList.add('hidden');
                document.getElementById('tabLogin').className = "w-1/2 py-2.5 font-bold text-teal-700 border-b-2 border-teal-700";
                document.getElementById('tabRegister').className = "w-1/2 py-2.5 font-bold text-slate-400";
            } else {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('registerForm').classList.remove('hidden');
                document.getElementById('tabRegister').className = "w-1/2 py-2.5 font-bold text-teal-700 border-b-2 border-teal-700";
                document.getElementById('tabLogin').className = "w-1/2 py-2.5 font-bold text-slate-400";
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: document.getElementById('loginPhone').value, password: document.getElementById('loginPass').value })
            });
            const data = await res.json();
            if (data.success) {
                localStorage.setItem('lk_user', JSON.stringify(data.user));
                window.location.href = data.user.role === 'ADMIN' ? '/admin' : '/';
            } else {
                alert(data.error);
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    fullName: document.getElementById('regName').value,
                    phone: document.getElementById('regPhone').value,
                    password: document.getElementById('regPass').value
                })
            });
            const data = await res.json();
            if (data.success) {
                localStorage.setItem('lk_user', JSON.stringify(data.user));
                alert("Đăng ký tài khoản thành công!");
                window.location.href = '/';
            } else {
                alert(data.error);
            }
        });
    </script>
</body>
</html>
