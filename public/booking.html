<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Lịch Khám - Phòng Khám Lộc Khang</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #007bff; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background-color: #007bff; color: white; padding: 12px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #666; text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Đặt Lịch Khám Bệnh</h2>
    <form id="bookingForm">
        <div class="form-group">
            <label for="patientName">Họ và tên bệnh nhân:</label>
            <input type="text" id="patientName" required placeholder="Nhập họ tên đầy đủ">
        </div>

        <div class="form-group">
            <label for="phone">Số điện thoại liên hệ:</label>
            <input type="tel" id="phone" required placeholder="Nhập số điện thoại">
        </div>

        <div class="form-group">
            <label for="service">Dịch vụ khám:</label>
            <select id="service" required>
                <option value="">-- Chọn dịch vụ --</option>
                <option value="Khám tổng quát">Khám tổng quát</option>
                <option value="Khám nội khoa">Khám nội khoa</option>
                <option value="Khám tim mạch">Khám tim mạch</option>
            </select>
        </div>

        <div class="form-group">
            <label for="doctor">Bác sĩ khám:</label>
            <select id="doctor" required>
                <option value="">-- Chọn bác sĩ --</option>
                <option value="BS. Nguyễn Văn A">BS. Nguyễn Văn A</option>
                <option value="BS. Trần Thị B">BS. Trần Thị B</option>
            </select>
        </div>

        <div class="form-group">
            <label for="appointmentDate">Ngày khám:</label>
            <input type="date" id="appointmentDate" required>
        </div>

        <div class="form-group">
            <label for="timeSlot">Khung giờ:</label>
            <select id="timeSlot" required>
                <option value="">-- Chọn giờ khám --</option>
                <option value="08:00 - 09:00">08:00 - 09:00</option>
                <option value="09:00 - 10:00">09:00 - 10:00</option>
                <option value="14:00 - 15:00">14:00 - 15:00</option>
                <option value="15:00 - 16:00">15:00 - 16:00</option>
            </select>
        </div>

        <button type="submit">Xác Nhận Đặt Lịch</button>
    </form>
    <a href="/" class="back-link">← Quay về Trang chủ</a>
</div>

<script>
document.getElementById('bookingForm').addEventListener('submit', async (e) => {
    e.preventDefault(); // Chặn hành vi load lại trang mặc định của form

    // Lấy dữ liệu từ các ô input
    const patientName = document.getElementById('patientName').value;
    const phone = document.getElementById('phone').value;
    const service = document.getElementById('service').value;
    const doctor = document.getElementById('doctor').value;
    const appointmentDate = document.getElementById('appointmentDate').value;
    const timeSlot = document.getElementById('timeSlot').value;

    try {
        const response = await fetch('/api/appointments', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ patientName, phone, service, doctor, appointmentDate, timeSlot })
        });

        const data = await response.json();

        if (response.ok) {
            alert('Đặt lịch thành công! Mã lịch hẹn của bạn là: ' + data.apptCode);
            document.getElementById('bookingForm').reset(); // Reset form sau khi đặt thành công
        } else {
            alert('Lỗi: ' + (data.error || 'Không thể đặt lịch'));
        }
    } catch (err) {
        console.error('Lỗi kết nối:', err);
        alert('Không thể kết nối đến máy chủ!');
    }
});
</script>

</body>
</html>
