<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Phòng Khám Lộc Khang</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { color: #007bff; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background-color: #28a745; color: white; padding: 12px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #666; text-decoration: none; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Đăng Nhập Hệ Thống</h2>
    <form id="loginForm">
        <div class="form-group">
            <label for="email">Email đăng nhập:</label>
            <input type="email" id="email" required placeholder="name@example.com">
        </div>

        <div class="form-group">
            <label for="password">Mật khẩu:</label>
            <input type="password" id="password" required placeholder="********">
        </div>

        <button type="submit">Đăng Nhập</button>
    </form>
    <a href="/" class="back-link">← Quay về Trang chủ</a>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
            alert('Đăng nhập thành công!');
            window.location.href = '/admin'; // Chuyển đến trang quản trị sau khi đăng nhập thành công
        } else {
            alert('Đăng nhập thất bại: ' + (data.error || 'Sai thông tin tài khoản'));
        }
    } catch (err) {
        console.error('Lỗi kết nối:', err);
        alert('Có lỗi xảy ra khi kết nối tới máy chủ.');
    }
});
</script>

</body>
</html>
